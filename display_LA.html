<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="60">
<title>Suivi Entretien LA — Affichage</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#0d0f14;--surface:#161820;--surface2:#1e2028;--border:#2a2d38;
  --accent:#00d4ff;--accent2:#7c3aed;--green:#10b981;--yellow:#f59e0b;
  --red:#ef4444;--text:#e2e8f0;--muted:#64748b;
  --mono:'DM Mono',monospace;--sans:'Space Grotesk',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;padding:1.5rem;}

header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:1.5rem;padding-bottom:1rem;
  border-bottom:1px solid var(--border);
}
.logo{font-family:var(--mono);font-size:1rem;color:var(--accent);letter-spacing:.1em;display:flex;align-items:center;gap:.75rem;}
.logo-badge{background:var(--accent);color:#000;font-weight:700;padding:3px 10px;border-radius:4px;}
.logo-year{font-size:.75rem;color:var(--muted);border:1px solid var(--border);padding:2px 8px;border-radius:3px;}
.header-right{display:flex;align-items:center;gap:1rem;}
.refresh-info{font-family:var(--mono);font-size:.72rem;color:var(--muted);}
.last-update{font-family:var(--mono);font-size:.72rem;color:var(--muted);}
.conn-pill{font-size:.7rem;font-family:var(--mono);padding:.22rem .7rem;border-radius:10px;border:1px solid;display:flex;align-items:center;gap:.4rem;}
.conn-pill.on{color:var(--green);border-color:var(--green);}
.conn-dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.5rem;}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.25rem;position:relative;overflow:hidden;}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.kpi-card.c-blue::before{background:var(--accent);}
.kpi-card.c-green::before{background:var(--green);}
.kpi-card.c-yellow::before{background:var(--yellow);}
.kpi-card.c-purple::before{background:var(--accent2);}
.kpi-label{font-size:.7rem;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem;}
.kpi-value{font-size:2rem;font-weight:700;font-family:var(--mono);line-height:1;margin-bottom:.3rem;}
.kpi-card.c-blue .kpi-value{color:var(--accent);}
.kpi-card.c-green .kpi-value{color:var(--green);}
.kpi-card.c-yellow .kpi-value{color:var(--yellow);}
.kpi-card.c-purple .kpi-value{color:var(--accent2);}
.kpi-detail{font-size:.75rem;color:var(--muted);}

/* RING */
.main-grid{display:grid;grid-template-columns:200px 1fr;gap:1.25rem;margin-bottom:1.5rem;}
.ring-block{display:flex;flex-direction:column;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.25rem;}
.ring-container{position:relative;width:160px;height:160px;}
.ring-svg{transform:rotate(-90deg);}
.ring-track{fill:none;stroke:var(--border);stroke-width:14;}
.ring-fill{fill:none;stroke:var(--accent);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset 1s ease;}
.ring-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
.ring-pct{font-size:1.8rem;font-weight:700;font-family:var(--mono);color:var(--accent);display:block;}
.ring-text{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;}
.legend{display:flex;gap:1rem;margin-top:.75rem;justify-content:center;}
.leg{display:flex;align-items:center;gap:.4rem;font-size:.7rem;color:var(--muted);font-family:var(--mono);}
.leg-dot{width:7px;height:7px;border-radius:50%;}

/* CAT GRID */
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:1.5rem;}
.cat-row{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.75rem 1rem;display:flex;align-items:center;gap:.75rem;}
.cat-name{flex:1;font-size:.8rem;font-weight:500;}
.cat-bar-wrap{width:90px;height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
.cat-bar{height:100%;border-radius:3px;}
.pct-lbl{font-family:var(--mono);font-size:.7rem;width:32px;text-align:right;font-weight:600;}
.cat-stats{font-family:var(--mono);font-size:.7rem;color:var(--muted);white-space:nowrap;}

/* SECTION TITLE */
.section-title{font-size:.9rem;font-weight:600;color:var(--text);margin-bottom:.75rem;display:flex;align-items:center;gap:.6rem;}
.section-title::after{content:'';flex:1;height:1px;background:var(--border);}

/* CHART */
.chart-block{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.25rem;}

/* LOADING */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-family:var(--mono);font-size:.85rem;color:var(--muted);}

@media(max-width:900px){
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .cat-grid{grid-template-columns:repeat(2,1fr);}
  .main-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div class="loading-text">Chargement des données...</div>
</div>

<div id="app" style="display:none;">
  <header>
    <div class="logo">
      <span class="logo-badge">LA</span>
      Suivi Entretien Annuel
      <span class="logo-year" id="logo-year">2026</span>
    </div>
    <div class="header-right">
      <span class="refresh-info">↻ Rafraîchissement auto toutes les 60s</span>
      <span class="last-update" id="last-update">—</span>
      <span class="conn-pill on" id="conn-pill"><span class="conn-dot"></span>En ligne</span>
    </div>
  </header>

  <!-- KPIs -->
  <div class="kpi-grid">
    <div class="kpi-card c-blue"><div class="kpi-label">Total éléments</div><div class="kpi-value" id="kpi-total">—</div><div class="kpi-detail">Tous types</div></div>
    <div class="kpi-card c-green"><div class="kpi-label">Terminés</div><div class="kpi-value" id="kpi-done">—</div><div class="kpi-detail" id="kpi-pct">—</div></div>
    <div class="kpi-card c-yellow"><div class="kpi-label">Restants</div><div class="kpi-value" id="kpi-left">—</div><div class="kpi-detail">À planifier</div></div>
    <div class="kpi-card c-purple"><div class="kpi-label">Types d'entretien</div><div class="kpi-value" id="kpi-sheets">—</div><div class="kpi-detail">Catégories</div></div>
  </div>

  <!-- Ring + Chart -->
  <div class="main-grid">
    <div class="ring-block">
      <div class="ring-container">
        <svg class="ring-svg" width="160" height="160" viewBox="0 0 160 160">
          <circle class="ring-track" cx="80" cy="80" r="65"/>
          <circle class="ring-fill" id="ring-fill" cx="80" cy="80" r="65" stroke-dasharray="408.4" stroke-dashoffset="408.4"/>
        </svg>
        <div class="ring-label">
          <span class="ring-pct" id="ring-pct">0%</span>
          <span class="ring-text">Avancement</span>
        </div>
      </div>
      <div class="legend">
        <div class="leg"><div class="leg-dot" style="background:var(--accent)"></div>Terminés</div>
        <div class="leg"><div class="leg-dot" style="background:var(--border)"></div>Restants</div>
      </div>
    </div>
    <div class="chart-block">
      <div class="section-title" style="margin-bottom:.75rem;">Avancement par types d'entretien</div>
      <svg id="bar-chart" width="100%" height="180" style="display:block;"></svg>
    </div>
  </div>

  <!-- Cat grid -->
  <div class="section-title">Détail par type d'entretien</div>
  <div class="cat-grid" id="cat-grid"></div>
</div>

<script>
// ── FIREBASE CONFIG ────────────────────────
firebase.initializeApp({
  apiKey:      "AIzaSyDVTvV5J4o98jA7kCzmpFqsisg-zOHo4Xs",
  projectId:   "suivi-entretien-la",
  databaseURL: "https://suivi-entretien-la-default-rtdb.europe-west1.firebasedatabase.app"
});
var db = firebase.database();
var fbData = {};

// ── CONNECTION ─────────────────────────────
db.ref(".info/connected").on("value", function(snap){
  var pill = document.getElementById("conn-pill");
  if(snap.val()){
    pill.className="conn-pill on";
    pill.innerHTML='<span class="conn-dot"></span>En ligne';
  } else {
    pill.className="conn-pill off";
    pill.innerHTML='<span class="conn-dot"></span>Hors ligne';
  }
});

// ── YEAR ───────────────────────────────────
db.ref("annee").on("value", function(snap){
  var yr = snap.val()||"2026";
  document.getElementById("logo-year").textContent = yr;
});

// ── DATA ───────────────────────────────────
db.ref("entretien").on("value", function(snap){
  var val = snap.val();
  if(!val) return;
  fbData = val;
  document.getElementById("loading").style.display = "none";
  document.getElementById("app").style.display = "block";
  render();
});

function safeKey(s){ return s.replace(/[.#$[\]/]/g,"_"); }

function st(sheet){
  var items = fbData[sheet]||{};
  var total = Object.keys(items).length;
  var done  = Object.values(items).filter(Boolean).length;
  return {total:total, done:done, left:total-done, pct:total?Math.round(done/total*100):0};
}

function gst(){
  var total=0, done=0;
  for(var s in fbData){ var x=st(s); total+=x.total; done+=x.done; }
  return {total:total, done:done, left:total-done, pct:total?Math.round(done/total*100):0};
}

function render(){
  var g = gst();
  document.getElementById("kpi-total").textContent  = g.total.toLocaleString("fr");
  document.getElementById("kpi-done").textContent   = g.done.toLocaleString("fr");
  document.getElementById("kpi-pct").textContent    = g.pct+"% d'avancement";
  document.getElementById("kpi-left").textContent   = g.left.toLocaleString("fr");
  document.getElementById("kpi-sheets").textContent = Object.keys(fbData).length;
  document.getElementById("last-update").textContent =
    "Mis à jour : "+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});

  var C = 408.4;
  document.getElementById("ring-fill").style.strokeDashoffset = C-(g.pct/100)*C;
  document.getElementById("ring-pct").textContent = g.pct+"%";

  // Cat grid
  var grid = document.getElementById("cat-grid");
  grid.innerHTML = "";
  Object.keys(fbData).forEach(function(sheet){
    var s = st(sheet);
    var col = s.pct===100?"var(--green)":s.pct>50?"var(--accent)":s.pct>0?"var(--yellow)":"var(--red)";
    var div = document.createElement("div");
    div.className = "cat-row";
    div.innerHTML =
      "<div class='cat-name'>"+sheet.replace(/_/g,".")+"</div>"+
      "<div class='cat-bar-wrap'><div class='cat-bar' style='width:"+s.pct+"%;background:"+col+"'></div></div>"+
      "<div class='pct-lbl' style='color:"+col+"'>"+s.pct+"%</div>"+
      "<div class='cat-stats'>"+s.done+"/"+s.total+"</div>";
    grid.appendChild(div);
  });

  renderBarChart();
}

function renderBarChart(){
  var svg = document.getElementById("bar-chart");
  var W = svg.parentElement.clientWidth-40, H=180;
  svg.setAttribute("viewBox","0 0 "+W+" "+H);
  svg.innerHTML="";
  var sheets=Object.keys(fbData);
  if(!sheets.length) return;
  var step=(W-20)/sheets.length, bw=Math.max(5,Math.min(24,step-6));
  sheets.forEach(function(sheet,i){
    var s=st(sheet), bh=Math.max(2,(s.pct/100)*(H-28));
    var x=10+i*step+step/2-bw/2, y=H-18-bh;
    var col=s.pct===100?"#10b981":s.pct>50?"#00d4ff":s.pct>0?"#f59e0b":"#2a2d38";
    var r=document.createElementNS("http://www.w3.org/2000/svg","rect");
    r.setAttribute("x",x);r.setAttribute("y",y);r.setAttribute("width",bw);r.setAttribute("height",bh);
    r.setAttribute("rx","3");r.setAttribute("fill",col);r.setAttribute("opacity","0.85");
    var t=document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x",x+bw/2);t.setAttribute("y",H-3);t.setAttribute("text-anchor","middle");
    t.setAttribute("font-size","7");t.setAttribute("fill","#64748b");t.setAttribute("font-family","DM Mono,monospace");
    t.textContent=sheet.length>9?sheet.slice(0,8)+"...":sheet;
    svg.appendChild(r);svg.appendChild(t);
  });
}
</script>
</body>
</html>
